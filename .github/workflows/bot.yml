name: mymarket-bot

on:
  schedule:
    - cron: "*/10 * * * *"      # every 10 minutes (GitHub may start it a few minutes late)
  workflow_dispatch: {}          # "Run workflow" button for manual runs

concurrency:
  group: mymarket-bot
  cancel-in-progress: false

permissions:
  contents: write                # needed to save state.json back to the repository

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check mymarket
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python bot.py

      - name: Save state
        if: always()
        run: |
          git config user.name "mymarket-bot"
          git config user.email "mymarket-bot@users.noreply.github.com"
          git add -f state.json 2>/dev/null || exit 0
          git diff --cached --quiet || (git commit -m "state" && git push)
